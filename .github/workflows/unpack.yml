name: Import portfolio source

on:
  push:
    paths:
      - 'portfolio-source.zip'
      - '.github/workflows/unpack.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source archive
        shell: bash
        run: |
          test -f portfolio-source.zip || exit 0
          unzip -o portfolio-source.zip -d .
          rm portfolio-source.zip
      - name: Commit source tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Import complete portfolio source"
          git push
